name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Check and test (Node.js 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in lib/*.js; do
            node --check "$file" || exit 1
          done
      # Node 22 discovers tests under test/ when no path is passed.
      # Inline mocks let this run without installing host packages.
      - name: Run unit tests
        run: node --test
