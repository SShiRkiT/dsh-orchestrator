name: Publish to npm

'on':
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure npm CLI supports Trusted Publishing (OIDC)
        shell: bash
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Verify release tag matches package.json version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          echo "Package: ${PKG_NAME}@${PKG_VERSION}"
          if [ "${EVENT_NAME}" = "release" ]; then
            if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
              echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${EXPECTED_TAG}'."
              exit 1
            fi
            echo "Verified release tag ${RELEASE_TAG} matches package.json."
          else
            echo "Manual dispatch (${EVENT_NAME}): skipping release tag check; will publish ${PKG_NAME}@${PKG_VERSION}."
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in lib/*.js; do
            node --check "$file" || exit 1
          done

      # Node discovers tests under test/ when no path is passed.
      # Inline mocks let this run without installing host packages.
      - name: Run unit tests
        run: node --test

      - name: Publish to npm via Trusted Publishing (OIDC)
        run: npm publish --provenance --access public
